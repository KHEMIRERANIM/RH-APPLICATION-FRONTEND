<div class="p-6 text-center" style="min-width: 300px;">
    <div class="text-4xl mb-4">{{getIcon()}}</div>
    <h2 class="text-xl font-bold mb-2">{{data.title}}</h2>
    <p class="text-gray-600 mb-6">{{data.message}}</p>
    <div class="flex justify-center gap-3">
        <button *ngIf="data.showCancel !== false" 
                class="px-4 py-2 border rounded-lg hover:bg-gray-50 transition"
                (click)="onCancel()">
            {{data.cancelText || 'Annuler'}}
        </button>
        <button class="px-4 py-2 text-white rounded-lg transition"
                [style.backgroundColor]="getButtonColor()"
                (click)="onConfirm()">
            {{data.confirmText || 'Confirmer'}}
        </button>
    </div>
</div>
