<div class="question-card">
    <div class="question-header">
        <span class="question-number">Question {{ index + 1 }}</span>
        <button type="button" class="btn-remove" (click)="onRemove()">🗑️</button>
    </div>

    <div class="form-group">
        <label>Texte de la question *</label>
        <!-- ✅ Utiliser le FormControl directement -->
        <textarea [formControl]="texteControl" rows="2" placeholder="Saisissez votre question..."></textarea>
    </div>

    <div class="form-row">
        <div class="form-group">
            <label>Type de question</label>
            <!-- ✅ Utiliser le FormControl directement -->
            <select [formControl]="typeControl" (change)="onTypeChange()">
                <option *ngFor="let type of typesQuestion" [value]="type.value">
                    {{ type.icon }} {{ type.label }}
                </option>
            </select>
        </div>

        <div class="form-group">
            <label>Points</label>
            <!-- ✅ Utiliser le FormControl directement -->
            <input type="number" [formControl]="pointsControl" min="1" max="10">
        </div>
    </div>

    <!-- Options pour QCM -->
    <div *ngIf="typeControl.value === 'QCM'" class="options-section">
        <label>Options de réponse</label>
        <div *ngFor="let opt of getOptions().controls; let j = index" class="option-item">
            <div [formGroup]="opt">
                <input type="text" formControlName="texte" placeholder="Option {{ j + 1 }}">
                <label class="checkbox-label">
                    <input type="checkbox" formControlName="estCorrect"> Correcte
                </label>
                <button type="button" class="btn-remove-option" (click)="onRemoveOption(j)">✕</button>
            </div>
        </div>
        <button type="button" class="btn-add-option" (click)="onAddOption()">+ Ajouter une option</button>
    </div>

    <!-- Réponse pour TEXTE -->
    <div *ngIf="typeControl.value === 'TEXTE'" class="form-group">
        <label>Réponse correcte</label>
        <input type="text" [formControl]="correctAnswerControl" placeholder="Réponse attendue">
    </div>

    <!-- Template pour CODE -->
    <div *ngIf="typeControl.value === 'CODE'" class="form-group">
        <label>Template de code (optionnel)</label>
        <textarea [formControl]="codeTemplateControl" rows="4" placeholder="Template de départ..."></textarea>
    </div>
</div>
