<div style="display:flex;flex-direction:column;width:100%;box-sizing:border-box;background:white;border-radius:16px;overflow:hidden;">

  <!-- Header -->
  <div style="display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid #f3f4f6;">
    <div style="display:flex;align-items:center;gap:12px;">
      <div style="width:44px;height:44px;border-radius:12px;background:#ede9fe;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;">
        👥
      </div>
      <div>
        <h2 style="font-size:17px;font-weight:700;color:#111827;margin:0;">
          Employés — {{ career.title }}
        </h2>
        <p style="font-size:12px;color:#9ca3af;margin:0;">
          {{ employees.length }} employé{{ employees.length > 1 ? 's' : '' }} sur ce poste
        </p>
      </div>
    </div>
    <button (click)="close()"
            style="background:#f9fafb;border:1px solid #e5e7eb;cursor:pointer;width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#6b7280;font-size:16px;">
      ✕
    </button>
  </div>

  <!-- Body -->
  <mat-dialog-content style="padding:20px !important;margin:0 !important;max-height:55vh;overflow-y:auto;">

    <!-- Loading -->
    <div *ngIf="isLoading" style="display:flex;justify-content:center;padding:40px;">
      <mat-spinner diameter="32"></mat-spinner>
    </div>

    <!-- Empty -->
    <div *ngIf="!isLoading && employees.length === 0"
         style="display:flex;flex-direction:column;align-items:center;padding:48px;gap:12px;">
      <span style="font-size:48px;">🪑</span>
      <p style="font-size:14px;color:#9ca3af;margin:0;">Aucun employé sur ce poste actuellement</p>
    </div>

    <!-- Liste employés -->
    <div *ngIf="!isLoading && employees.length > 0"
         style="display:flex;flex-direction:column;gap:10px;">

      <div *ngFor="let emp of employees"
           style="display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:12px;border:1px solid #f3f4f6;background:#fafafa;">

        <!-- Avatar -->
        <div *ngIf="!emp.photoUrl"
             style="width:44px;height:44px;border-radius:50%;background:#7c3aed;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:white;flex-shrink:0;">
          {{ getInitials(emp.prenom, emp.nom) }}
        </div>
        <img *ngIf="emp.photoUrl"
             [src]="emp.photoUrl" [alt]="emp.prenom"
             style="width:44px;height:44px;border-radius:50%;object-fit:cover;flex-shrink:0;" />

        <!-- Info -->
        <div style="flex:1;min-width:0;">
          <p style="font-size:14px;font-weight:700;color:#111827;margin:0;">
            {{ emp.prenom }} {{ emp.nom }}
          </p>
          <p style="font-size:12px;color:#6b7280;margin:2px 0 0;">
            {{ emp.email }}
          </p>
          <p *ngIf="emp.departement"
             style="font-size:11px;color:#9ca3af;margin:2px 0 0;">
            🏢 {{ emp.departement }}
          </p>
        </div>

        <!-- Statut -->
        <span [style]="'padding:4px 10px;border-radius:9999px;font-size:11px;font-weight:700;flex-shrink:0;' + getStatusColor(emp.status)">
          {{ emp.status || '—' }}
        </span>

      </div>
    </div>

  </mat-dialog-content>

  <!-- Footer -->
  <div style="padding:16px 24px;border-top:1px solid #f3f4f6;display:flex;justify-content:flex-end;">
    <button (click)="close()"
            style="padding:0 24px;height:40px;border-radius:8px;border:1.5px solid #e5e7eb;background:white;cursor:pointer;font-size:14px;font-weight:500;color:#374151;font-family:inherit;">
      Fermer
    </button>
  </div>

</div>
