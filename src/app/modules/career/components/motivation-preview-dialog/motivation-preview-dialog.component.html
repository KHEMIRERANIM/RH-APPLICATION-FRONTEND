<div style="display:flex;flex-direction:column;width:100%;height:100%;background:white;border-radius:16px;overflow:hidden;">

  <!-- HEADER -->
  <div style="display:flex;justify-content:space-between;align-items:center;padding:20px;border-bottom:1px solid #eee;">

    <div>
      <h2 style="margin:0;font-size:16px;font-weight:700;">
        Lettre de motivation
      </h2>

      <p style="margin:0;font-size:12px;color:#777;">
        {{ request?.employeeName }} — {{ request?.motivationFileName }}
      </p>
    </div>

    <div style="display:flex;gap:10px;">

      <button (click)="download()"
              style="padding:6px 12px;border-radius:6px;border:1px solid #ddd;background:white;cursor:pointer;">
        ⬇ Télécharger
      </button>

      <button (click)="close()"
              style="padding:6px 10px;border-radius:6px;border:1px solid #ddd;background:#f5f5f5;cursor:pointer;">
        ✕
      </button>

    </div>

  </div>

  <!-- BODY -->
  <div style="flex:1;position:relative;">

    <!-- LOADING -->
    <div *ngIf="isLoading"
         style="display:flex;justify-content:center;align-items:center;height:100%;">
      <mat-spinner diameter="40"></mat-spinner>
    </div>

    <!-- PDF -->
    <iframe *ngIf="pdfUrl && !isLoading"
            [src]="pdfUrl"
            style="width:100%;height:100%;border:none;">
    </iframe>

    <!-- ERROR -->
    <div *ngIf="!isLoading && !pdfUrl"
         style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:10px;">

      <div style="font-size:40px;">❌</div>

      <div>Impossible d'afficher le PDF</div>

      <button (click)="download()"
              style="padding:10px 16px;border:none;background:#7c3aed;color:white;border-radius:6px;">
        Télécharger
      </button>

    </div>

  </div>

</div>
