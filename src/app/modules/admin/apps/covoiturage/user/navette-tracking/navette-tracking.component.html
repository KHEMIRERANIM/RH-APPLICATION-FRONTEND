<div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">

  <!-- Header statut -->
  <div class="flex items-center justify-between p-4 border-b border-gray-100">
    <div class="flex items-center gap-3">
      <div class="w-3 h-3 rounded-full"
           [ngClass]="statut === 'En route' ? 'bg-green-500 animate-pulse' : 'bg-gray-400'">
      </div>
      <span class="font-medium text-gray-700">{{ statut }}</span>
    </div>
    <span class="text-sm text-gray-500">Navette en direct</span>
  </div>

  <!-- Temps restant -->
  <div class="grid grid-cols-2 gap-4 p-4 bg-gray-50">
    <div class="text-center">
      <p class="text-sm text-gray-500 mb-1">Temps restant</p>
      <p class="text-2xl font-bold text-[#0F3460]">{{ tempsRestant }}</p>
    </div>
    <div class="text-center">
      <p class="text-sm text-gray-500 mb-1">Distance</p>
      <p class="text-2xl font-bold text-[#1D9E75]">{{ distance }}</p>
    </div>
  </div>

  <!-- Carte -->
  <div #trackingMap style="height: 350px; width: 100%;"></div>

</div>
