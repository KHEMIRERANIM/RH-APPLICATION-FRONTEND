<div class="flex flex-col flex-auto min-w-0">
  <div class="flex flex-col sm:flex-row flex-0 sm:items-center sm:justify-between p-6 sm:px-10 border-b bg-card">
    <div class="flex flex-1 items-center">
      <div class="w-12 h-12 rounded-lg bg-primary-100 dark:bg-primary-900 flex items-center justify-center mr-4">
        <mat-icon svgIcon="heroicons_outline:office-building" class="text-primary-600 dark:text-primary-400"></mat-icon>
      </div>
      <div>
        <h2 class="text-xl font-semibold">Restaurant</h2>
        <p class="text-secondary mt-1">Menus, catalogue et commandes</p>
      </div>
    </div>
    <nav class="flex items-center space-x-6 mt-6 sm:mt-0 font-medium text-secondary" aria-label="Navigation restaurant">
      <a routerLink="menus" routerLinkActive="text-primary-600 font-semibold" class="flex items-center hover:text-primary-600 transition-colors">
        <mat-icon class="icon-size-5 mr-2" svgIcon="heroicons_outline:clipboard-list"></mat-icon>
        Menus
      </a>
      <a routerLink="plats" routerLinkActive="text-primary-600 font-semibold" class="flex items-center hover:text-primary-600 transition-colors">
        <mat-icon class="icon-size-5 mr-2" svgIcon="heroicons_outline:view-grid"></mat-icon>
        Catalogue
      </a>
      <a routerLink="commandes" routerLinkActive="text-primary-600 font-semibold" class="flex items-center hover:text-primary-600 transition-colors">
        <mat-icon class="icon-size-5 mr-2" svgIcon="heroicons_outline:shopping-bag"></mat-icon>
        Commandes
      </a>
      <a routerLink="avis" routerLinkActive="text-primary-600 font-semibold" class="flex items-center hover:text-primary-600 transition-colors">
        <mat-icon class="icon-size-5 mr-2" svgIcon="heroicons_outline:star"></mat-icon>
        Avis
      </a>
    </nav>
  </div>
  <div class="flex-auto p-6 sm:p-8 bg-gray-100 dark:bg-transparent">
    <router-outlet></router-outlet>
  </div>
  <app-restaurant-mini-panier *ngIf="roleService.isEmploye()"></app-restaurant-mini-panier>
</div>
