<div class="p-8 max-w-2xl">
    <h1 class="text-2xl font-bold mb-6">Paramètres du calendrier</h1>
    
    <form [formGroup]="settingsForm" class="space-y-6">
        <!-- Format de date -->
        <div>
            <label class="block text-sm font-medium mb-2">Format de date</label>
            <mat-form-field appearance="outline" class="w-full">
                <mat-select formControlName="dateFormat">
                    <mat-option value="DD/MM/YYYY">31/12/2024</mat-option>
                    <mat-option value="MM/DD/YYYY">12/31/2024</mat-option>
                    <mat-option value="YYYY-MM-DD">2024-12-31</mat-option>
                    <mat-option value="ll">31 déc. 2024</mat-option>
                </mat-select>
            </mat-form-field>
        </div>

        <!-- Format d'heure -->
        <div>
            <label class="block text-sm font-medium mb-2">Format d'heure</label>
            <mat-form-field appearance="outline" class="w-full">
                <mat-select formControlName="timeFormat">
                    <mat-option value="HH:mm">14:30 (24h)</mat-option>
                    <mat-option value="hh:mm A">02:30 PM (12h)</mat-option>
                </mat-select>
            </mat-form-field>
        </div>

        <!-- Premier jour de la semaine -->
        <div>
            <label class="block text-sm font-medium mb-2">Premier jour de la semaine</label>
            <mat-form-field appearance="outline" class="w-full">
                <mat-select formControlName="startWeekOn">
                    <mat-option value="1">Lundi</mat-option>
                    <mat-option value="0">Dimanche</mat-option>
                    <mat-option value="6">Samedi</mat-option>
                </mat-select>
            </mat-form-field>
        </div>

        <!-- Boutons d'action -->
        <div class="flex justify-end gap-3 pt-4 border-t">
            <button mat-button type="button" routerLink="/apps/formations">Annuler</button>
            <button mat-raised-button color="primary" type="button" (click)="saveSettings()" [disabled]="settingsForm.invalid">
                Enregistrer
            </button>
        </div>
    </form>
</div>
