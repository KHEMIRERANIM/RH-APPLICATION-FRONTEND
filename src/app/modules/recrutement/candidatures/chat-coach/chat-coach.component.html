<!-- Floating Button -->
<button *ngIf="!isOpen" mat-fab color="primary"
  class="fixed bottom-6 right-6 z-50 shadow-2xl hover:scale-105 transition-transform" (click)="toggleChat()"
  [ngClass]="{'bg-indigo-600': !isInterviewMode, 'bg-slate-800': isInterviewMode}">
  <mat-icon
    [svgIcon]="isInterviewMode ? 'heroicons_outline:briefcase' : 'heroicons_outline:chat-bubble-oval-left-ellipsis'"
    class="text-white icon-size-8"></mat-icon>
</button>

<!-- Chat Window -->
<div *ngIf="isOpen" [@slideInOut]
  class="fixed bottom-6 right-6 z-50 w-80 sm:w-96 rounded-3xl overflow-hidden glassmorphism border border-white/20 shadow-2xl flex flex-col bg-white/40 dark:bg-gray-900/60 backdrop-blur-xl">

  <!-- Header -->
  <div class="p-4 text-white flex justify-between items-center shadow-md transition-colors duration-500"
    [ngClass]="isInterviewMode ? 'bg-gradient-to-r from-slate-700 to-gray-900' : 'bg-gradient-to-r from-indigo-500/90 to-purple-600/90'">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center p-1 relative">
        <mat-icon [svgIcon]="isInterviewMode ? 'heroicons_outline:briefcase' : 'heroicons_outline:academic-cap'"
          class="text-white icon-size-6"></mat-icon>
        <span class="w-3 h-3 rounded-full absolute bottom-0 right-0 border-2"
          [ngClass]="isInterviewMode ? 'bg-red-400 border-slate-700' : 'bg-green-400 border-indigo-600'"></span>
      </div>
      <div>
        <h3 class="font-bold leading-tight">{{ isInterviewMode ? 'Recruteur IA' : 'Career Coach' }}</h3>
        <p class="text-xs text-indigo-100 flex items-center gap-1">
          {{ isInterviewMode ? 'Mode Évaluation Active' : 'IA Anti-Biais' }}
        </p>
      </div>
    </div>
    <button mat-icon-button (click)="toggleChat()" class="text-white hover:bg-white/10 rounded-full">
      <mat-icon [svgIcon]="'heroicons_outline:chevron-down'"></mat-icon>
    </button>
  </div>

  <!-- Messages Body -->
  <div class="flex-auto h-80 overflow-y-auto p-4 flex flex-col gap-3 custom-scrollbar" #scrollMe>

    <!-- Quick Actions (Only at start or if specifically requested) -->
    <div class="flex flex-wrap gap-2 justify-center mb-2">
      <button (click)="toggleInterviewMode()"
        class="text-xs px-3 py-1.5 rounded-full border border-indigo-200 bg-white/70 hover:bg-indigo-50 dark:bg-gray-800 dark:border-gray-600 dark:text-gray-200 transition-colors shadow-sm flex items-center gap-1">
        <mat-icon [svgIcon]="'heroicons_outline:briefcase'" class="icon-size-4"></mat-icon>
        {{ isInterviewMode ? 'Arrêter Entretien' : 'Simulateur Entretien' }}
      </button>
    </div>

    <div *ngFor="let msg of messages" class="flex"
      [ngClass]="{'justify-end': msg.sender === 'user', 'justify-start': msg.sender === 'bot'}">

      <!-- Bot Message -->
      <div *ngIf="msg.sender === 'bot'"
        class="max-w-[85%] bg-white/80 dark:bg-gray-800/80 rounded-2xl p-3 shadow-sm border"
        [ngClass]="isInterviewMode ? 'border-slate-300 dark:border-slate-600 rounded-tl-sm' : 'border-indigo-100 dark:border-indigo-900 rounded-tl-sm'">
        <!-- Parse HTML if needed, but here simple text rendering with newlines -->
        <p class="text-sm text-gray-800 dark:text-gray-100 leading-relaxed whitespace-pre-wrap">{{ msg.text }}</p>
      </div>

      <!-- User Message -->
      <div *ngIf="msg.sender === 'user'" class="max-w-[85%] rounded-2xl rounded-tr-sm p-3 shadow-md text-white"
        [ngClass]="isInterviewMode ? 'bg-gradient-to-br from-slate-600 to-slate-800' : 'bg-gradient-to-br from-indigo-500 to-indigo-600'">
        <p class="text-sm leading-relaxed">{{ msg.text }}</p>
      </div>

    </div>

    <!-- Typing Indicator -->
    <div *ngIf="isTyping" class="flex justify-start">
      <div
        class="bg-white/80 dark:bg-gray-800/80 rounded-2xl rounded-tl-sm p-3 shadow-sm flex items-center gap-1 w-16 h-10">
        <div class="w-1.5 h-1.5 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0ms;"></div>
        <div class="w-1.5 h-1.5 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 150ms;"></div>
        <div class="w-1.5 h-1.5 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 300ms;"></div>
      </div>
    </div>

  </div>

  <!-- Input Area -->
  <div class="p-3 bg-white/60 dark:bg-gray-900 border-t border-gray-200/50 dark:border-gray-800 transition-colors"
    [ngClass]="isListening ? 'bg-red-50/50 dark:bg-red-900/20' : ''">
    <div class="flex items-center bg-white dark:bg-gray-800 rounded-full shadow-inner p-1 pl-4 border"
      [ngClass]="isListening ? 'border-red-300 ring-2 ring-red-100 dark:ring-red-900' : 'border-gray-100 dark:border-gray-700'">

      <input type="text" [(ngModel)]="userInput" (keyup.enter)="sendMessage()" (paste)="onPaste($event)"
        [placeholder]="isListening ? 'Écoute en cours...' : 'Posez votre question...'"
        class="flex-auto bg-transparent border-none focus:ring-0 text-sm py-2 dark:text-white dark:placeholder-gray-400 focus:outline-none" />

      <!-- Voice Input Button -->
      <button mat-icon-button (click)="toggleListening()"
        class="ml-1 rounded-full text-gray-500 hover:text-red-500 transition-colors"
        [ngClass]="isListening ? 'text-red-500 animate-pulse bg-red-100 dark:bg-red-900/50' : ''">
        <mat-icon [svgIcon]="isListening ? 'heroicons_outline:stop-circle' : 'heroicons_outline:microphone'"
          class="icon-size-5"></mat-icon>
      </button>

      <!-- Send Button -->
      <button mat-icon-button color="primary" (click)="sendMessage()" [disabled]="!userInput.trim() && !isListening"
        class="bg-indigo-50 dark:bg-indigo-900/30 ml-1 rounded-full disabled:opacity-50"
        [ngClass]="isInterviewMode ? 'text-slate-600 bg-slate-100' : 'text-indigo-600 bg-indigo-50'">
        <mat-icon [svgIcon]="'heroicons_outline:paper-airplane'"
          class="transform -rotate-45 -mt-1 ml-1 icon-size-5"></mat-icon>
      </button>
    </div>
  </div>

</div>
