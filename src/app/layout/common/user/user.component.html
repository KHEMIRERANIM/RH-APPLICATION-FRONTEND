<!-- Button -->
<button
    mat-icon-button
    [matMenuTriggerFor]="userActions">
    <span class="flex items-center justify-center relative w-8 h-8 rounded-full overflow-hidden bg-gray-100 border border-gray-200 shadow-sm">
        <img
            class="w-full h-full object-cover"
            *ngIf="showAvatar && user.avatar"
            [src]="user.avatar">
        <mat-icon
            *ngIf="!showAvatar || !user.avatar"
            class="icon-size-5 text-gray-400"
            [svgIcon]="'heroicons_solid:user-circle'"></mat-icon>
        <span
            class="absolute right-0 bottom-0 w-2 h-2 rounded-full border border-white ring-1 ring-white"
            [ngClass]="{'bg-green-500 shadow-[0_0_0_2px_rgba(34,197,94,0.3)]': user.status === 'online',
                          'bg-amber-500': user.status === 'away',
                          'bg-red-500': user.status === 'busy',
                          'bg-gray-400': user.status === 'not-visible'}"
        ></span>
    </span>
</button>

<mat-menu
    [xPosition]="'before'"
    class="user-menu"
    #userActions="matMenu">
    <div class="px-4 py-3 border-b border-gray-200 dark:border-gray-700 min-w-64">
        <div class="flex items-center">
            <img *ngIf="user.avatar" [src]="user.avatar" class="w-10 h-10 rounded-full object-cover" alt="">
            <mat-icon *ngIf="!user.avatar" [svgIcon]="'heroicons_outline:user-circle'" class="icon-size-10 text-gray-400"></mat-icon>
            <div class="ml-3 flex flex-col">
                <span class="text-sm font-semibold">{{user.name}}</span>
                <span class="text-xs text-secondary">{{user.email}}</span>
                <span class="mt-1 inline-flex items-center px-2 py-0.5 rounded text-xs font-medium"
                      [ngClass]="{
                          'bg-primary-100 text-primary-800 dark:bg-primary-900 dark:text-primary-200': user.role === 'admin',
                          'bg-blue-100 text-blue-800 dark:bg-blue-900 dark:text-blue-200': user.role === 'employe',
                          'bg-amber-100 text-amber-800 dark:bg-amber-900 dark:text-amber-200': user.role === 'candidat'
                      }">
                    <ng-container *ngIf="user.role === 'admin'">Administrateur</ng-container>
                    <ng-container *ngIf="user.role === 'employe'">Employé</ng-container>
                    <ng-container *ngIf="user.role === 'candidat'">Candidat</ng-container>
                    <ng-container *ngIf="!user.role">Utilisateur</ng-container>
                </span>
            </div>
        </div>
    </div>
    <button mat-menu-item [routerLink]="['/pages/profile']">
        <mat-icon [svgIcon]="'heroicons_outline:user-circle'"></mat-icon>
        <span>Mon profil</span>
    </button>
    <button mat-menu-item [routerLink]="['/pages/settings']">
        <mat-icon [svgIcon]="'heroicons_outline:cog'"></mat-icon>
        <span>Paramètres</span>
    </button>
    <mat-divider class="my-2"></mat-divider>
    <button
        mat-menu-item
        class="text-red-600 dark:text-red-400 font-medium"
        (click)="signOut()">
        <mat-icon [svgIcon]="'heroicons_outline:logout'"></mat-icon>
        <span>Déconnexion</span>
    </button>
</mat-menu>
